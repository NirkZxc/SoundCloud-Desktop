[package]
name = "soundcloud-desktop"
version = "1.0.0"
description = "A minimal desktop client for SoundCloud"
authors = ["SoundCloud Desktop Team"]
edition = "2021"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tauri-runtime-wry", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
once_cell = "1.19"

[build-dependencies]
tauri-build = { version = "2", features = [] }
